services:
  omnirag:
    build: .
    image: omnirag-core:1.0.0
    container_name: omnirag-core
    restart: unless-stopped
    ports:
      - "${OMNIRAG_PORT:-8000}:8000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MASTER_SECRET_KEY: ${MASTER_SECRET_KEY:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-30}
      ALLOW_PRIVATE_URLS: ${ALLOW_PRIVATE_URLS:-false}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Reachable only from this Compose network; no host port is published.
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.16}
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Downloads the default embedding model, then exits.
  ollama-pull:
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.16}
    restart: on-failure:5
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull"]
    command: ["${OLLAMA_EMBED_MODEL:-nomic-embed-text}"]

volumes:
  ollama_models:
